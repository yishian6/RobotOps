[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robotops-agent"
version = "0.1.0"
description = "Evidence-driven application incident investigation, starting with a local runtime."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=1,<2",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
robotops = "robotops.cli:main"

[tool.setuptools]
# 源码、非敏感资源和可运行示例分别组织；显式映射确保 wheel 不依赖仓库路径。
include-package-data = false
packages = ["robotops", "robotops.agent", "robotops.resources", "robotops_examples", "robotops_examples.pipeline"]
package-dir = {"robotops" = "src/robotops", "robotops.resources" = "config", "robotops_examples" = "examples"}

[tool.setuptools.package-data]
"robotops.resources" = ["robotops.toml", "prompts/investigation/*/*.txt", "prompts/investigation/*/manifest.json"]
"robotops_examples.pipeline" = ["contract.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
