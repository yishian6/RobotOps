# 非敏感运行配置；密钥只从 DEEPSEEK_API_KEY 环境变量读取。
# 文件中的相对路径以本配置所在目录为基准。
data_dir = "../data"
model = "deepseek-flash"
model_base_url = "https://api.deepseek.com"
model_timeout_seconds = 60
# 主 Agent 最多等这批子任务多少秒。到期后按缺测返回，主调查可继续。
branch_timeout_seconds = 120
# monitor 的轮询间隔，单位秒。单个服务状态读取超时由服务适配器单独处理。
monitor_interval_seconds = 5
# 默认直连；仅在确实需要继承系统代理/证书环境时改为 true。
model_trust_env = false
prompts_dir = "prompts"
# 明确固定 Prompt 版本；切换到已验证版本后重启服务，回退同样修改此值。
prompt_version = "v2"

# 仅选择上下文装配方式，不限制调查 Token、调用次数或总运行时长。
context_strategy = "evidence"
